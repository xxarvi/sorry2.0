<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>apology terminal · sorry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0f0b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    /* ---- background: repeated SORRY pattern, no glow ---- */
    .bg-sorry {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 0.6rem 1.2rem;
      padding: 1.2rem;
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
      overflow: hidden;
      font-size: clamp(1.4rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: 4px;
      color: #2e5e2e;
      text-transform: uppercase;
      line-height: 1.3;
      user-select: none;
    }

    .bg-sorry span {
      display: inline-block;
      white-space: nowrap;
    }

    /* ---- terminal window ---- */
    .terminal {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 820px;
      background: #0a100a;
      border: 2px solid #2e5e2e;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      padding: 24px 22px 30px;
      transition: all 0.2s;
      overflow: hidden;
    }

    /* subtle scanlines, very faint */
    .terminal::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.01) 0px,
        rgba(255, 255, 255, 0.01) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* terminal header */
    .terminal-header {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2e5e2e;
      position: relative;
      z-index: 2;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2e5e2e;
    }

    /* BIG SORRY — no extreme glow, just clean */
    .sorry-big {
      font-size: clamp(3.2rem, 14vw, 6.5rem);
      font-weight: 800;
      text-align: center;
      color: #b8e0b8;
      text-shadow: 0 0 8px rgba(46, 94, 46, 0.5);
      letter-spacing: 10px;
      line-height: 1.2;
      margin: 6px 0 16px;
      position: relative;
      z-index: 2;
      animation: glitch 3.2s infinite;
      word-break: break-word;
    }

    @keyframes glitch {
      0%, 100% { transform: skew(0deg, 0deg); opacity: 1; }
      94% { transform: skew(0deg, 0deg); opacity: 1; }
      95% { transform: skew(2deg, 1deg); opacity: 0.9; }
      96% { transform: skew(-1deg, -0.5deg); opacity: 1; }
      97% { transform: skew(1deg, 0deg); opacity: 0.95; }
      98% { transform: skew(-1deg, 0.5deg); opacity: 1; }
    }

    /* status line */
    .status-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #7a9f7a;
      background: #0d140d;
      padding: 10px 16px;
      border-radius: 30px;
      border: 1px solid #2e5e2e;
      margin-bottom: 28px;
      position: relative;
      z-index: 2;
      letter-spacing: 0.5px;
    }

    .status-line span:first-child::before {
      content: "▍";
      animation: blink 1.1s step-end infinite;
      margin-right: 6px;
      font-weight: bold;
      color: #7a9f7a;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 16px;
      background: #7a9f7a;
      vertical-align: middle;
      margin-left: 6px;
      animation: blink 1.2s step-end infinite;
      opacity: 0.8;
    }

    /* message area */
    .message-box {
      background: #0a0f0a;
      border-left: 6px solid #2e5e2e;
      padding: 22px 18px;
      border-radius: 12px;
      margin: 24px 0 28px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
      font-size: 1.7rem;
      font-weight: 500;
      color: #c0dcc0;
      text-align: center;
      word-break: break-word;
      transition: all 0.2s;
      position: relative;
      z-index: 2;
    }

    /* buttons */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      margin-top: 14px;
      position: relative;
      z-index: 2;
    }

    .btn {
      font-family: 'Fira Code', 'Courier New', monospace;
      background: transparent;
      border: 2px solid #2e5e2e;
      color: #b8e0b8;
      font-size: 1.6rem;
      font-weight: 700;
      padding: 14px 40px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      flex: 0 1 auto;
      min-width: 160px;
      position: relative;
    }

    .btn:hover {
      background: #2e5e2e;
      color: #0a0f0a;
      border-color: #3f7a3f;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7);
      transform: scale(1.02);
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* run-away no button */
    .btn-no-run {
      transition: transform 0.12s cubic-bezier(0.2, 1.4, 0.6, 1), background 0.2s, color 0.2s;
      position: relative;
      z-index: 5;
    }

    /* cute message for yes */
    .cute-message {
      color: #e8e0a0;
      text-shadow: 0 0 10px rgba(232, 224, 160, 0.4);
      font-size: 2.1rem;
    }

    /* responsive */
    @media (max-width: 600px) {
      .terminal {
        padding: 16px 12px 22px;
      }
      .sorry-big {
        letter-spacing: 5px;
        font-size: clamp(2.8rem, 13vw, 4.5rem);
      }
      .btn {
        font-size: 1.2rem;
        padding: 10px 18px;
        min-width: 120px;
        letter-spacing: 1.5px;
      }
      .message-box {
        font-size: 1.3rem;
        padding: 16px 10px;
        min-height: 100px;
      }
      .status-line {
        font-size: 0.65rem;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
      .bg-sorry {
        font-size: 1.8rem;
        gap: 0.4rem 0.8rem;
        opacity: 0.14;
      }
    }
  </style>
</head>
<body>
  <!-- background repeating SORRY -->
  <div class="bg-sorry" id="bgSorry"></div>

  <div class="terminal">
    <div class="terminal-header">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- big SORRY -->
    <div class="sorry-big">SORRY</div>

    <!-- status bar -->
    <div class="status-line">
      <span>apology.exe --force</span>
      <span>⏎  listening on port 1337 <span class="cursor"></span></span>
    </div>

    <!-- message area -->
    <div class="message-box" id="messageBox">
      &gt; waiting for input_
    </div>

    <!-- buttons -->
    <div class="buttons">
      <button class="btn" id="yesBtn">YES</button>
      <button class="btn btn-no-run" id="noBtn">NO</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 1. POPULATE BACKGROUND WITH "SORRY" ----------
      const bgContainer = document.getElementById('bgSorry');
      const sorryText = 'SORRY';
      // fill background with many spans
      for (let i = 0; i < 500; i++) {
        const span = document.createElement('span');
        span.textContent = sorryText;
        bgContainer.appendChild(span);
      }

      // ---------- 2. TERMINAL LOGIC ----------
      const messageBox = document.getElementById('messageBox');
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');

      // helper: move the NO button to a random offset
      function runAway(button) {
        const randomX = (Math.random() * 2 - 1) * 130;
        const randomY = (Math.random() * 2 - 1) * 80;
        button.style.transform = `translate(${randomX}px, ${randomY}px) scale(0.96)`;
      }

      // helper: show pwease message
      function showPwease() {
        messageBox.innerHTML = '&gt; pwease pwease 🥺<span class="cursor"></span>';
        messageBox.classList.remove('cute-message');
      }

      // helper: show sunflower + thank you pretty boy
      function showThankYou() {
        messageBox.innerHTML = '&gt; 🌻 thank uuuu prewti boy 🌻<span class="cursor"></span>';
        messageBox.classList.add('cute-message');
      }

      // clone the NO button to remove any pre-existing listeners (clean slate)
      const oldNoBtn = noBtn;
      const freshNoBtn = oldNoBtn.cloneNode(true);
      oldNoBtn.parentNode.replaceChild(freshNoBtn, oldNoBtn);

      // re-select yes button (unchanged)
      const freshYesBtn = document.getElementById('yesBtn');

      // set transition for smooth running
      freshNoBtn.style.transition = 'transform 0.12s cubic-bezier(0.2, 1.4, 0.6, 1)';

      // ----- NO BUTTON BEHAVIOR -----
      let touchFlag = false;

      // click handler for NO (mouse)
      freshNoBtn.addEventListener('click', function(e) {
        if (touchFlag) {
          // already handled by touchstart, just prevent double message
          runAway(freshNoBtn);
          e.preventDefault();
          return;
        }
        e.preventDefault();
        runAway(freshNoBtn);
        showPwease();
        // run again shortly after for extra "running" effect
        setTimeout(() => {
          runAway(freshNoBtn);
        }, 70);
      });

      // hover: move away (tease)
      freshNoBtn.addEventListener('mouseenter', function() {
        runAway(freshNoBtn);
      });

      // touch support for mobile
      freshNoBtn.addEventListener('touchstart', function(e) {
        touchFlag = true;
        runAway(freshNoBtn);
        showPwease();
        setTimeout(() => {
          runAway(freshNoBtn);
          touchFlag = false;
        }, 200);
      }, { passive: true });

      // ----- YES BUTTON BEHAVIOR -----
      freshYesBtn.addEventListener('click', function() {
        showThankYou();
        // move NO button away as a playful bonus
        setTimeout(() => {
          runAway(freshNoBtn);
        }, 100);
      });

      // reset message to default if needed? not necessary.
      // initial message already set.

      // Prevent any accidental form submission or page reload
      // (no forms anyway)
    })();
  </script>
</body>
</html>
